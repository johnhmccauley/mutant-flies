name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# `enablement: true` below turns Pages on for the repository the first time
# this runs, so the site needs no manual setup in Settings.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pinned, and it has to be: tools/test-worker.js runs the catalogue's
      # real schema against node:sqlite rather than a mock, and that does
      # not exist before Node 22. Without this step the runner's default
      # node decides whether the deploy works.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check the pages still parse before publishing them
        run: node tools/check.js

      - name: Check the ported rules still match the 1985 original
        run: node tools/test-rules.js

      - name: Check the monsters
        run: node tools/test-monsters.js

      - name: Check which way a leant phone walks him
        run: node tools/test-steer.js

      - name: Check the cellar furniture
        run: node tools/test-elements.js

      - name: Check the catalogue of made-up levels
        run: node tools/test-catalogue.js

      - name: Check a level packs into a code and back
        run: node tools/test-levelio.js

      - name: Check a player can be known without logging in
        run: node tools/test-identity.js

      - name: Check a level survives being written down and sent
        run: node tools/test-level-format.js

      - name: Check the vault a player's levels live in
        run: node tools/test-vault.js

      - name: Check the credit economy cannot be farmed
        run: node tools/test-credits.js

      - name: Check the catalogue server, against a real SQLite
        run: node tools/test-worker.js

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
