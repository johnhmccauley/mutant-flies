name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# `enablement: true` below turns Pages on for the repository the first time
# this runs, so the site needs no manual setup in Settings.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the pages still parse before publishing them
        run: node tools/check.js

      - name: Check the ported rules still match the 1985 original
        run: node tools/test-rules.js

      - name: Check the monsters
        run: node tools/test-monsters.js

      - name: Check the cellar furniture
        run: node tools/test-elements.js

      - name: Check the catalogue of made-up levels
        run: node tools/test-catalogue.js

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
