# One Worker serving the whole game: the static files and the catalogue
# API on the same hostname. Assets are matched first and served without
# running any code - free, uncounted, and why a megabyte of three.js
# costs nothing - except under /api/, which always runs the Worker.

name = "mutant-fly"
main = "worker/index.js"
compatibility_date = "2026-01-15"
# nothing here needs Node: the Stripe signature check is WebCrypto

[assets]
directory = "."
binding = "ASSETS"
# not a single-page app: /classic/ is a real second page
not_found_handling = "404-page"
# the catalogue must reach the Worker even though /api/ has no file
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "mutant-fly"
database_id = "put-the-real-id-here"

# A limiter, so one busy player cannot use up everybody else's share.
# Counted per player where the request says who it is, per address where
# it does not.
[[unsafe.bindings]]
name = "RATE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# SECRETS, none of which belong in this file. Set each with
#   wrangler secret put NAME
#
#   OPEN_BETA              "1" while the game is free to everybody. Every
#                          player who turns up while it is on is given a
#                          permanent entitlement as they go, so switching
#                          it off never takes anything away from anybody
#                          who was already here.
#   APP_KEYS               comma separated, so one can be rotated while
#                          browsers still hold the old page. Leave it
#                          unset and the check is off, which is what a
#                          local server and the tests want.
#   EMAIL_SALT             so a stored address hash is not a rainbow table
#   STRIPE_WEBHOOK_SECRET  to check a webhook really came from Stripe
#   APPLE_ISSUER_KEY       when the App Store is wired up
#   STEAM_WEB_API_KEY      when Steam is
#   PLAY_SERVICE_ACCOUNT   when Play is
#   ITCH_API_KEY           when itch is
