# One Worker serving the whole game: the static files and the catalogue
# API on the same hostname. Assets are matched first and served without
# running any code - free, uncounted, and why a megabyte of three.js
# costs nothing - except under /api/, which always runs the Worker.

name = "mutant-fly"
main = "worker/index.js"
compatibility_date = "2026-01-15"
# nothing here needs Node: the Stripe signature check is WebCrypto

[assets]
directory = "."
binding = "ASSETS"
# not a single-page app: /classic/ is a real second page
not_found_handling = "404-page"
# the catalogue must reach the Worker even though /api/ has no file
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "mutant-fly"
database_id = "put-the-real-id-here"

# EMAIL_SALT, STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are secrets,
# not vars: set them with `wrangler secret put NAME`, never in this file.
